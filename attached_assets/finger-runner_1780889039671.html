<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finger Runner</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #87CEEB;
        font-family: Arial, sans-serif;
        touch-action: none;
    }
    canvas {
        display: block;
    }
    #start-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        z-index: 10;
        background: rgba(0,0,0,0.45);
    }
    h1 {
        font-size: 3.8rem;
        margin: 0 0 12px 0;
        color: #ffd700;
        text-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    p {
        font-size: 1.45rem;
        margin: 6px 0;
    }
    button {
        margin-top: 28px;
        padding: 16px 48px;
        font-size: 1.55rem;
        background: #ff4757;
        color: white;
        border: none;
        border-radius: 60px;
        cursor: pointer;
        box-shadow: 0 8px 0 #c2363e;
        transition: all 0.1s;
    }
    button:active {
        transform: translateY(4px);
        box-shadow: 0 4px 0 #c2363e;
    }
    #music-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 20;
        padding: 10px 18px;
        font-size: 1.1rem;
        background: rgba(0,0,0,0.6);
        color: white;
        border: 2px solid #ffd700;
        border-radius: 30px;
        cursor: pointer;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start-screen">
    <h1>👆 FINGER RUNNER</h1>
    <p>Stick your fingers out the car window!</p>
    <p>Tap anywhere or press SPACE to jump</p>
    <p>Dodge trees, signs &amp; poles • Beat your best distance</p>
    <button onclick="startGame()">START RUNNING</button>
</div>

<button id="music-btn" onclick="toggleMusic()">🎵 Music: ON</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Game variables
let gameRunning = false;
let score = 0;
let bestScore = parseInt(localStorage.getItem('fingerRunnerBest') || '0');
let time = 0;
let velocity = 0;
let playerY = 300;

// Audio setup - Cool retro road trip music
let audioCtx;
let musicEnabled = true;
let musicInterval = null;
let melodyOsc = null;
let bassOsc = null;
let kickOsc = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playJumpSound() {
    if (!musicEnabled || !audioCtx) return;
    initAudio();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.type = 'sawtooth';
    osc.frequency.value = 680;
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    
    gain.gain.value = 0.35;
    
    const t = audioCtx.currentTime;
    osc.frequency.setValueAtTime(680, t);
    osc.frequency.linearRampToValueAtTime(420, t + 0.18);
    gain.gain.setValueAtTime(0.35, t);
    gain.gain.linearRampToValueAtTime(0.001, t + 0.22);
    
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start(t);
    osc.stop(t + 0.25);
}

function playCrashSound() {
    if (!musicEnabled || !audioCtx) return;
    initAudio();
    
    // Crash noise
    const noise = audioCtx.createBufferSource();
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.8, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    noise.buffer = buffer;
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;
    
    const gain = audioCtx.createGain();
    gain.gain.value = 0.9;
    
    const t = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.9, t);
    gain.gain.linearRampToValueAtTime(0.001, t + 0.75);
    
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    
    noise.start(t);
    
    // Low boom
    const boom = audioCtx.createOscillator();
    const boomGain = audioCtx.createGain();
    boom.type = 'sine';
    boom.frequency.value = 65;
    boomGain.gain.value = 1.2;
    boomGain.gain.linearRampToValueAtTime(0.001, t + 1.1);
    
    boom.connect(boomGain);
    boomGain.connect(audioCtx.destination);
    boom.start(t);
    boom.stop(t + 1.2);
}

function startMusic() {
    if (!musicEnabled) return;
    initAudio();
    if (musicInterval) return;
    
    let step = 0;
    
    musicInterval = setInterval(() => {
        if (!gameRunning && step > 4) return; // Only play menu music lightly
        
        const t = audioCtx.currentTime;
        const baseNote = 220; // A3
        
        // Melody (happy road trip vibe)
        const melodyNotes = [0, 4, 7, 12, 7, 4, 0, 2, 5, 9, 5, 2]; // Major-ish scale
        const note = baseNote * Math.pow(2, melodyNotes[step % melodyNotes.length] / 12);
        
        if (melodyOsc) melodyOsc.stop();
        melodyOsc = audioCtx.createOscillator();
        const mGain = audioCtx.createGain();
        const mFilter = audioCtx.createBiquadFilter();
        
        melodyOsc.type = 'sawtooth';
        melodyOsc.frequency.value = note;
        mFilter.type = 'lowpass';
        mFilter.frequency.value = 1800;
        mGain.gain.value = gameRunning ? 0.18 : 0.09;
        
        const envTime = gameRunning ? 0.38 : 0.55;
        mGain.gain.setValueAtTime(mGain.gain.value, t);
        mGain.gain.linearRampToValueAtTime(0.001, t + envTime);
        
        melodyOsc.connect(mFilter);
        mFilter.connect(mGain);
        mGain.connect(audioCtx.destination);
        melodyOsc.start(t);
        melodyOsc.stop(t + envTime + 0.05);
        
        // Bass line
        if (step % 2 === 0) {
            if (bassOsc) bassOsc.stop();
            bassOsc = audioCtx.createOscillator();
            const bGain = audioCtx.createGain();
            
            bassOsc.type = 'sine';
            bassOsc.frequency.value = baseNote / 2;
            bGain.gain.value = gameRunning ? 0.55 : 0.3;
            bGain.gain.linearRampToValueAtTime(0.001, t + 0.65);
            
            bassOsc.connect(bGain);
            bGain.connect(audioCtx.destination);
            bassOsc.start(t);
            bassOsc.stop(t + 0.7);
        }
        
        // Kick drum on beats
        if (step % 4 === 0) {
            if (kickOsc) kickOsc.stop();
            kickOsc = audioCtx.createOscillator();
            const kGain = audioCtx.createGain();
            const kFilter = audioCtx.createBiquadFilter();
            
            kickOsc.type = 'sine';
            kickOsc.frequency.value = 95;
            kFilter.type = 'lowpass';
            kFilter.frequency.value = 450;
            kGain.gain.value = 1.1;
            kGain.gain.linearRampToValueAtTime(0.001, t + 0.45);
            
            kickOsc.frequency.setValueAtTime(95, t);
            kickOsc.frequency.linearRampToValueAtTime(42, t + 0.25);
            
            kickOsc.connect(kFilter);
            kFilter.connect(kGain);
            kGain.connect(audioCtx.destination);
            kickOsc.start(t);
            kickOsc.stop(t + 0.5);
        }
        
        step++;
    }, gameRunning ? 185 : 280); // Faster tempo when playing
}

function stopMusic() {
    if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
    }
    if (melodyOsc) { melodyOsc.stop(); melodyOsc = null; }
    if (bassOsc) { bassOsc.stop(); bassOsc = null; }
    if (kickOsc) { kickOsc.stop(); kickOsc = null; }
}

function toggleMusic() {
    musicEnabled = !musicEnabled;
    const btn = document.getElementById('music-btn');
    
    if (musicEnabled) {
        btn.textContent = '🎵 Music: ON';
        if (gameRunning || document.getElementById('start-screen').style.display !== 'none') {
            startMusic();
        }
    } else {
        btn.textContent = '🎵 Music: OFF';
        stopMusic();
    }
}

// Game objects
const obstacles = [];
const particles = [];

const GRAVITY = 0.52;
const JUMP_FORCE = -13.5;
const BASE_SPEED = 4.5;

function spawnObstacle() {
    if (!gameRunning) return;
    
    const gapSize = Math.max(155, 235 - Math.floor(score / 7));
    const minTop = 75;
    const maxTop = height - gapSize - 155;
    const topHeight = minTop + Math.random() * (maxTop - minTop);
    
    const types = ['tree', 'pole', 'sign', 'bush'];
    const type = types[Math.floor(Math.random() * types.length)];
    
    obstacles.push({
        x: width + 90,
        top: topHeight,
        gap: gapSize,
        type: type,
        passed: false
    });
}

let spawnTimer = 0;

// Controls
function jump() {
    if (!gameRunning) {
        startGame();
        return;
    }
    
    velocity = JUMP_FORCE;
    playJumpSound();
    
    // Jump particles (dust)
    for (let i = 0; i < 9; i++) {
        particles.push({
            x: 175 + Math.random() * 35,
            y: playerY + 35,
            vx: -2.5 - Math.random() * 3.5,
            vy: -2.5 + Math.random() * 4,
            life: 26,
            size: 5 + Math.random() * 4,
            color: '#f1c27d'
        });
    }
}

canvas.addEventListener('pointerdown', jump);
document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
    }
    if (e.code === 'KeyM') {
        toggleMusic();
    }
});

function createCrashExplosion(x, y) {
    for (let i = 0; i < 35; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.2 + Math.random() * 5.5;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.8,
            life: 38 + Math.random() * 25,
            size: 6 + Math.random() * 7,
            color: ['#f1c27d', '#c8946f', '#ff6b6b', '#888'][Math.floor(Math.random()*4)]
        });
    }
}

function crash() {
    if (!gameRunning) return;
    
    gameRunning = false;
    playCrashSound();
    createCrashExplosion(175, playerY + 25);
    
    if (score > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('fingerRunnerBest', bestScore);
    }
    
    // Slow down music
    if (musicEnabled) {
        stopMusic();
        setTimeout(() => {
            if (!gameRunning && musicEnabled) startMusic();
        }, 600);
    }
}

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    gameRunning = true;
    score = 0;
    obstacles.length = 0;
    particles.length = 0;
    playerY = height * 0.42;
    velocity = JUMP_FORCE * 0.55;
    spawnTimer = 0;
    
    // Start energetic music
    stopMusic();
    if (musicEnabled) {
        setTimeout(startMusic, 80);
    }
}

function drawBackground() {
    // Beautiful sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#5db8f0');
    grad.addColorStop(0.45, '#8ed0ff');
    grad.addColorStop(1, '#c8e8ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
    
    // Distant hills
    ctx.fillStyle = '#7aa8c2';
    ctx.beginPath();
    ctx.moveTo(0, height * 0.72);
    ctx.quadraticCurveTo(width * 0.25, height * 0.48, width * 0.55, height * 0.76);
    ctx.quadraticCurveTo(width * 0.82, height * 0.42, width, height * 0.69);
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.fill();
    
    // Closer hills
    ctx.fillStyle = '#5d8a9e';
    ctx.beginPath();
    ctx.moveTo(0, height * 0.78);
    ctx.quadraticCurveTo(width * 0.35, height * 0.58, width * 0.7, height * 0.81);
    ctx.quadraticCurveTo(width * 0.92, height * 0.62, width, height * 0.77);
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.fill();
    
    // Ground / road
    ctx.fillStyle = '#3b2f22';
    ctx.fillRect(0, height - 108, width, 108);
    
    // Car window sill / door
    ctx.fillStyle = '#2c2f33';
    ctx.fillRect(0, height - 92, width, 92);
    ctx.fillStyle = '#555c66';
    ctx.fillRect(0, height - 102, width, 14);
    
    // Simple road lines (moving feel)
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 4;
    for (let i = -1; i < 6; i++) {
        const xPos = ((time * 3.5) % (width + 180)) + i * (width / 5) - 90;
        ctx.beginPath();
        ctx.moveTo(xPos, height - 55);
        ctx.lineTo(xPos + 70, height - 55);
        ctx.stroke();
    }
}

function drawFinger() {
    const bob = Math.sin(time * 0.18) * 2.8;
    const px = 168;
    const py = playerY + bob;
    
    // Shadow under fingers
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(px + 8, height - 78, 38, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Arms / wrists
    ctx.strokeStyle = '#e0b38a';
    ctx.lineWidth = 24;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px - 10, py + 52);
    ctx.lineTo(px - 18, py + 8);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(px + 14, py + 52);
    ctx.lineTo(px + 22, py + 10);
    ctx.stroke();
    
    // Fingers
    ctx.lineWidth = 16;
    ctx.strokeStyle = '#f0c090';
    
    // Left finger (index)
    ctx.beginPath();
    ctx.moveTo(px - 16, py + 42);
    ctx.quadraticCurveTo(px - 26, py - 18, px - 12, py - 55);
    ctx.stroke();
    
    // Right finger (middle)
    ctx.beginPath();
    ctx.moveTo(px + 16, py + 42);
    ctx.quadraticCurveTo(px + 30, py - 12, px + 24, py - 58);
    ctx.stroke();
    
    // Fingertips (flesh)
    ctx.fillStyle = '#e89a70';
    ctx.beginPath();
    ctx.arc(px - 12, py - 55, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + 24, py - 58, 12, 0, Math.PI * 2);
    ctx.fill();
    
    // Nails
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px - 13, py - 59, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + 23, py - 63, 5.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Tiny knuckle lines
    ctx.strokeStyle = '#d48a60';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(px - 18, py - 22);
    ctx.lineTo(px - 6, py - 22);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px + 18, py - 26);
    ctx.lineTo(px + 30, py - 26);
    ctx.stroke();
}

function drawObstacle(o) {
    const w = 82;
    
    // Main structure color
    ctx.fillStyle = '#3b2f22';
    ctx.fillRect(o.x, 0, w, o.top);
    ctx.fillRect(o.x, o.top + o.gap, w, height - o.top - o.gap - 92);
    
    if (o.type === 'tree') {
        // Trunk already drawn
        ctx.fillStyle = '#228b22';
        ctx.beginPath();
        ctx.arc(o.x + w/2, o.top - 22, 46, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(o.x + w/2, o.top + o.gap + 38, 40, 0, Math.PI * 2);
        ctx.fill();
        
        // Highlights
        ctx.fillStyle = '#32a852';
        ctx.beginPath();
        ctx.arc(o.x + w/2 - 12, o.top - 30, 18, 0, Math.PI * 2);
        ctx.fill();
    } 
    else if (o.type === 'sign') {
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(o.x + 14, o.top - 58, w - 28, 42);
        ctx.fillRect(o.x + 14, o.top + o.gap + 14, w - 28, 42);
        
        ctx.fillStyle = '#d32f2f';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SLOW', o.x + w/2, o.top - 30);
        ctx.fillText('STOP', o.x + w/2, o.top + o.gap + 42);
    } 
    else if (o.type === 'pole') {
        ctx.fillStyle = '#444';
        ctx.fillRect(o.x + 34, o.top - 95, 14, 110);
        ctx.fillRect(o.x + 34, o.top + o.gap - 5, 14, 110);
        
        // Reflective stripe
        ctx.fillStyle = '#aaa';
        ctx.fillRect(o.x + 37, o.top - 70, 8, 25);
    } 
    else { // bush
        ctx.fillStyle = '#1e8449';
        ctx.beginPath();
        ctx.ellipse(o.x + w/2, o.top - 15, 48, 30, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(o.x + w/2, o.top + o.gap + 42, 42, 26, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function update() {
    if (!gameRunning) return;
    
    time++;
    score += 0.75; // Distance feel
    
    // Player physics
    velocity += GRAVITY;
    playerY += velocity;
    
    // Boundaries
    if (playerY > height - 175) {
        playerY = height - 175;
        velocity = 0;
    }
    if (playerY < 35) {
        playerY = 35;
        velocity = 1.8;
    }
    
    // Spawn logic
    spawnTimer++;
    const spawnRate = Math.max(42, 58 - Math.floor(score / 12));
    if (spawnTimer > spawnRate) {
        spawnObstacle();
        spawnTimer = 0;
    }
    
    // Update & check obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= BASE_SPEED + (score * 0.0075);
        
        // Collision detection
        const fingerLeft = 135;
        const fingerRight = 205;
        const fingerTop = playerY - 55;
        const fingerBottom = playerY + 48;
        
        if (o.x < fingerRight && o.x + 82 > fingerLeft) {
            if (fingerTop < o.top || fingerBottom > o.top + o.gap) {
                crash();
                return;
            }
        }
        
        // Passed obstacle
        if (!o.passed && o.x + 82 < fingerLeft) {
            o.passed = true;
        }
        
        if (o.x < -120) {
            obstacles.splice(i, 1);
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.18;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    drawBackground();
    
    // Draw obstacles behind fingers
    for (const o of obstacles) {
        drawObstacle(o);
    }
    
    // Draw particles
    ctx.shadowBlur = 0;
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0.15, p.life / 45);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size || 6, p.size || 6);
    }
    ctx.globalAlpha = 1;
    
    drawFinger();
    
    // Score HUD
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 56px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(Math.floor(score), 38, 82);
    
    ctx.font = 'bold 24px Arial';
    ctx.fillText('BEST ' + bestScore, 40, 118);
    ctx.shadowBlur = 0;
    
    // Game over overlay
    if (!gameRunning && score > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.72)';
        ctx.fillRect(width/2 - 240, height/2 - 125, 480, 250);
        
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 46px Arial';
        ctx.fillText('CRASHED!', width/2, height/2 - 45);
        
        ctx.font = 'bold 30px Arial';
        ctx.fillText('Distance: ' + Math.floor(score), width/2, height/2 + 5);
        
        if (Math.floor(score) >= bestScore && score > 5) {
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 26px Arial';
            ctx.fillText('★ NEW RECORD! ★', width/2, height/2 + 45);
        }
        
        ctx.fillStyle = '#ddd';
        ctx.font = '22px Arial';
        ctx.fillText('Tap anywhere or press SPACE to try again', width/2, height/2 + 95);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Boot the game
gameLoop();

// Initial music (menu music)
setTimeout(() => {
    if (musicEnabled) {
        startMusic();
    }
}, 650);

// Easter egg: Press M to toggle music
console.log('%c[Finger Runner] Press M to toggle music. Enjoy the ride!', 'color:#888');
</script>
</body>
</html>
