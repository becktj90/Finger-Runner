name: Deploy Beckify to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORT: "3000"
      BASE_PATH: "/"
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Build the Booty Butt Scooter game at the /scooter/ sub-path so it can be
      # launched from the hub. Its vite.config requires PORT and BASE_PATH.
      - name: Build Booty Butt Scooter (game)
        run: PORT=3000 BASE_PATH=/scooter/ pnpm --filter @workspace/finger-runner-engine build
      # Build the games-splash hub that lives at the play.beckify.com root.
      - name: Build Beckify hub
        run: BASE_PATH=/ pnpm --filter @workspace/beckify build
      # Nest the game inside the hub output so it's served at /scooter/.
      - name: Nest game under hub
        run: |
          rm -rf artifacts/beckify/dist/public/scooter
          cp -r artifacts/finger-runner/dist/public artifacts/beckify/dist/public/scooter
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/beckify/dist/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
